<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f2f7">
  <title>Кабинет школы · Daisy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
  <style>
:root {
  color-scheme: light;
  --bg: #f3f2f7;
  --surface: #ffffff;
  --surface-2: #ebe9f2;
  --line: #e2e0ea;
  --ink: #1b1930;
  --ink-2: #55526a;
  --ink-3: #8b889d;
  --daisy: #f7c948;
  --daisy-soft: #fdf1c9;
  --daisy-ink: #3b2e00;
  --ok: #1d8f53;
  --bad: #c43d33;
  --shadow: 0 1px 2px rgba(27, 25, 48, 0.05), 0 6px 18px rgba(27, 25, 48, 0.06);
  --display: "Unbounded", "Onest", system-ui, sans-serif;
  --body: "Onest", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #111018;
    --surface: #1b1a25;
    --surface-2: #262433;
    --line: #2e2b3c;
    --ink: #f2f1f8;
    --ink-2: #b7b4c8;
    --ink-3: #86839a;
    --daisy: #f5c63f;
    --daisy-soft: #3a3115;
    --daisy-ink: #f8e7a2;
    --ok: #45c983;
    --bad: #f07a70;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body, #root { min-height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.45;
}
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, p { margin: 0; }
.d { font-family: var(--display); font-weight: 600; letter-spacing: -0.01em; }
.muted { color: var(--ink-3); }
.sub { color: var(--ink-2); }
.fine { font-size: 12.5px; color: var(--ink-3); }
.fine.bad { color: var(--bad); }
.label { font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
.app {
  max-width: 440px;
  margin: 0 auto;
  min-height: 100%;
  padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px));
}
@media (min-width: 600px) {
  body { background: var(--surface-2); }
  .app { background: var(--bg); border-inline: 1px solid var(--line); min-height: 100vh; }
}
.top, .subtop {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--bg);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
}
.grow { flex: 1; min-width: 0; }
.top h2, .subtop h2 { font-size: 17px; }
.logo { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 600; font-size: 17px; }
.logo svg { width: 28px; height: 28px; }
.login .logo { font-size: 22px; }
.login .logo svg { width: 44px; height: 44px; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px;
  display: grid; place-items: center; position: relative;
  flex: none; line-height: 0;
}
.icon-btn.ask { color: var(--daisy-ink); }
.icon-btn.ask svg { transform: translateY(1px); width: 24px; height: 24px; stroke-width: 1.35; }
.icon-btn.ask .ask-bubble { fill: var(--daisy); stroke: var(--daisy-ink); }
.bell-dot {
  position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%;
  background: var(--bad); box-shadow: 0 0 0 2px var(--bg);
}
.li.unread b { position: relative; }
.li.unread b::after {
  content: ""; display: inline-block; width: 7px; height: 7px; margin-left: 8px;
  border-radius: 50%; background: var(--daisy); vertical-align: middle;
}
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn:active, .kid-switch:active, .tab:active { transform: scale(0.96); }
.kid-switch {
  display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px;
  border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; font-size: 14px;
}
.view { display: flex; flex-direction: column; gap: 16px; padding: 8px 16px 20px; }
.page-title { font-size: 24px; padding-top: 8px; padding-bottom: 4px; line-height: 1.2; }
.card, .list {
  background: var(--surface);
  border-radius: 20px;
  box-shadow: var(--shadow);
}
.card { padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.hero { display: flex; gap: 16px; align-items: center; padding: 6px 0 4px; }
.hero .meta { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.hero h1 { font-size: 26px; line-height: 1.15; }
.hero .sub, .hero .muted { line-height: 1.4; }
.ph, .av {
  display: grid; place-items: center; color: #fff; font-family: var(--display); font-weight: 600;
  background: radial-gradient(circle at 30% 25%, hsl(var(--h) 85% 82%), hsl(calc(var(--h) + 25) 55% 52%));
}
.ph { width: 112px; height: 112px; border-radius: 32px; font-size: 44px; }
.portrait {
  width: 84px; height: 84px; border-radius: 24px; flex: none; object-fit: cover;
  display: grid; place-items: center; color: #fff; font-family: var(--display); font-weight: 600; font-size: 30px;
  background: radial-gradient(circle at 30% 25%, hsl(var(--h) 85% 78%), hsl(calc(var(--h) + 28) 55% 48%));
}
.person-row { flex-direction: row; align-items: center; gap: 14px; width: 100%; text-align: left; }
.person-row > div { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.person-row h3,
.person-row .muted,
.person-row p {
  overflow: hidden;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
}
.chip {
  display: inline-flex;
  align-items: center;
  font-size: 12px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 999px;
  background: var(--daisy-soft);
  color: var(--daisy-ink);
}
.chip.ok { background: color-mix(in srgb, var(--ok) 16%, var(--surface)); color: var(--ok); }
.chip.bad { background: color-mix(in srgb, var(--bad) 16%, var(--surface)); color: var(--bad); }
.name-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.av { width: 26px; height: 26px; border-radius: 50%; font-size: 12px; flex: none; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.big { font-family: var(--display); font-size: 19px; font-weight: 600; line-height: 1.2; }
.schedule { display: flex; flex-direction: column; gap: 12px; }
.schedule-head { gap: 8px; }
.schedule-head h3 { font-size: 22px; line-height: 1.15; }
.schedule-note { white-space: pre-line; }
.place-line { display: flex; align-items: flex-start; gap: 8px; }
.place-line svg { width: 18px; height: 18px; flex: none; margin-top: 2px; }
.day-mark {
  width: 52px; flex: none; background: var(--surface-2); border-radius: 14px;
  padding: 8px 0; text-align: center; font-family: var(--display); font-weight: 600; font-size: 16px;
}
.lesson-time { display: block; font-variant-numeric: tabular-nums; }
.list { overflow: hidden; }
.li { display: flex; align-items: center; gap: 12px; padding: 14px 16px; width: 100%; text-align: left; }
.li + .li { border-top: 1px solid var(--line); }
.li small { display: block; color: var(--ink-3); font-size: 13px; }
.chev { color: var(--ink-3); }
.chev svg { width: 18px; height: 18px; }
.seg { display: flex; background: var(--surface-2); border-radius: 14px; padding: 4px; gap: 4px; }
.seg span, .seg button { flex: 1; text-align: center; padding: 8px 6px; border-radius: 10px; font-weight: 600; font-size: 14px; color: var(--ink-3); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); }
.months { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding: 2px 16px 4px; }
.months::-webkit-scrollbar { display: none; }
.mo {
  flex: none; width: 58px; padding: 8px 0 7px; border-radius: 14px; background: var(--surface);
  border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 3px; font-weight: 600;
}
.mo small { font-size: 10.5px; font-weight: 500; color: var(--ink-3); }
.mo[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.mo[aria-pressed="true"] small { color: var(--bg); opacity: 0.75; }
.mo.now { border-color: var(--daisy); border-width: 2px; }
.program-title { font-size: 20px; }
.program-card { gap: 8px; }
.dir { gap: 10px; }
.dir-head { display: flex; align-items: center; gap: 10px; }
.dir-head h3 { font-size: 17px; }
.dir-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; margin-top: 5px; }
.dir-head .dir-dot { margin-top: 0; }
.dir-line { display: flex; align-items: flex-start; gap: 8px; font-size: 14px; }
.dir-line b { font-weight: 600; }
.kv { display: grid; grid-template-columns: 92px 1fr; gap: 4px 10px; font-size: 14px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; white-space: pre-wrap; }
.report-card {
  position: relative; overflow: hidden; isolation: isolate;
  background: var(--daisy); color: var(--daisy-ink); box-shadow: none;
  padding-right: 72px;
}
.report-card h3 { font-family: var(--display); font-size: 22px; line-height: 1.15; }
.report-card p { color: var(--daisy-ink); opacity: 0.82; }
.report-card .chip {
  background: #1a1710; color: #f3d78a; width: fit-content; margin-bottom: 6px;
  font-family: var(--display); font-size: 12px; font-weight: 600;
  padding: 5px 12px; letter-spacing: 0.01em;
}
.report-bloom {
  position: absolute; right: -16px; bottom: -20px; width: 96px; height: 96px;
  pointer-events: none; z-index: 0;
}
.report-card > :not(.report-bloom) { position: relative; z-index: 1; }
.report-index { display: flex; flex-direction: column; gap: 12px; }
.report-month {
  background: var(--surface); border-radius: 22px; padding: 16px 16px 14px;
  box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 4px;
}
.report-month.new { background: var(--daisy); color: var(--daisy-ink); }
.report-month.new .label, .report-month.new .muted { color: var(--daisy-ink); opacity: 0.72; }
.report-month h2 { font-family: var(--display); font-size: 26px; line-height: 1.05; }
.report { display: flex; flex-direction: column; gap: 12px; }
.report-lead { padding: 2px 2px 0; }
.report-lead h1 { font-size: 26px; line-height: 1.1; margin-top: 4px; }
.report-block {
  background: var(--surface); border-radius: 22px; padding: 16px;
  box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px;
}
.report-block h4 {
  margin: 0; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--ink-3); font-weight: 700;
}
.report-block p { margin: 0; white-space: pre-wrap; }
.report-block ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.report-block.accent { background: var(--daisy); color: var(--daisy-ink); box-shadow: none; }
.report-block.accent h4 { color: var(--daisy-ink); opacity: 0.62; }
.report-note { padding: 0 4px; }
.event-list { display: flex; flex-direction: column; gap: 12px; }
.event-card h1, .event-card h2 { font-size: 22px; line-height: 1.15; }
.event-text { white-space: pre-wrap; }
.event-status { font-weight: 600; }
.event-form { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
.choice-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.choice {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  padding: 10px 14px;
  border-radius: 14px;
  background: var(--surface-2);
  font-weight: 600;
  text-align: left;
}
.choice small { font-weight: 500; color: var(--ink-3); font-size: 12.5px; }
.choice[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.choice[aria-pressed="true"] small { color: inherit; opacity: 0.72; }
.event-past-title { font-size: 18px; padding: 4px 2px 0; }
.head-row { display: flex; align-items: center; padding: 6px 4px 0; }
.head-row a { font-weight: 600; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 13px 18px; border-radius: 14px; font-weight: 600; background: var(--ink); color: var(--bg); width: 100%;
  transition: transform 0.12s ease, filter 0.12s ease, background-color 0.2s ease, box-shadow 0.2s ease;
}
.btn:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.05); }
.btn:active:not(:disabled) { transform: translateY(1px) scale(0.98); }
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn:disabled { opacity: 0.45; }
.btn.busy:disabled { opacity: 1; cursor: progress; }
.btn.busy::before {
  content: "";
  width: 15px; height: 15px; flex: none; border-radius: 50%;
  border: 2px solid currentColor; border-right-color: transparent;
  animation: spin 0.7s linear infinite;
}
.btn.done { background: var(--ok); color: #fff; }
@keyframes spin { to { transform: rotate(360deg); } }
.field { display: flex; flex-direction: column; gap: 6px; }
.field span { font-size: 13px; color: var(--ink-3); font-weight: 500; }
.input { background: var(--surface-2); border: 1px solid transparent; border-radius: 12px; padding: 12px 14px; width: 100%; }
.input:focus { outline: none; border-color: var(--ink); }
.code { display: grid; grid-template-columns: repeat(4, 56px); gap: 10px; }
.code input { text-align: center; font-size: 24px; font-weight: 600; padding: 12px 0; }
.steps { display: flex; gap: 6px; }
.steps i { height: 4px; flex: 1; border-radius: 2px; background: var(--line); }
.steps i.on { background: var(--ink); }
.login {
  position: fixed; inset: 0; z-index: 70; background: var(--bg); display: flex; justify-content: center; overflow: auto;
}
.login .in {
  width: min(100%, 440px); display: flex; flex-direction: column; gap: 18px; justify-content: center; min-height: 100%;
  padding: 32px 24px;
}
.login h1 { font-size: 24px; line-height: 1.2; }
.linkish { font-size: 14px; font-weight: 600; }
.tabs {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: min(100%, 440px); z-index: 25;
  background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(6, 1fr);
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
}
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 500; color: var(--ink-3); padding: 4px 0; position: relative; }
.tab svg { width: 23px; height: 23px; }
.tab.active { color: var(--ink); font-weight: 600; }
.tab.active::before { content: ""; position: absolute; top: -6px; width: 22px; height: 3px; border-radius: 0 0 3px 3px; background: var(--daisy); }
.overlay { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.overlay.center { align-items: center; padding: 20px; }
.scrim { position: absolute; inset: 0; background: rgba(20, 18, 36, 0.45); }
.sheet {
  position: relative; width: min(100%, 440px); background: var(--bg); border-radius: 24px 24px 0 0;
  padding: 10px 16px calc(20px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); align-self: center; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.people { display: flex; flex-direction: column; gap: 12px; }
.person-sheet {
  position: relative;
  width: min(100%, 360px);
  background: var(--surface);
  border-radius: 28px;
  box-shadow: var(--shadow);
  padding: 24px 20px 22px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 10px;
  max-height: min(82vh, 640px);
  overflow: auto;
}
.person-sheet-face { width: 112px; height: 112px; border-radius: 32px; font-size: 44px; }
.person-sheet-text { white-space: pre-wrap; text-align: left; width: 100%; }
.person-sheet-reach { font-weight: 700; color: var(--ink); }
.video-feed { display: flex; flex-direction: column; gap: 12px; }
.video-feed video { width: 100%; border-radius: 16px; background: #14121a; }
.progress-feed { display: flex; flex-direction: column; gap: 14px; }
.points { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pt {
  background: var(--surface); border-radius: 16px; padding: 10px 12px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 2px; min-width: 0;
}
.pt b { font-family: var(--display); font-size: 20px; line-height: 1.1; }
.pt small { font-size: 12px; color: var(--ink-3); line-height: 1.3; }
.pt.wait { background: transparent; box-shadow: none; border: 1.5px dashed var(--line); }
.pt.wait b { color: var(--ink-3); }
.compare-card { gap: 10px; }
.compare-card h3 { font-size: 17px; }
.compare-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.grew {
  flex: none; background: color-mix(in srgb, var(--ok) 16%, var(--surface)); color: var(--ok);
  font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
}
.legend { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 18px; height: 8px; border-radius: 4px; display: inline-block; }
.legend i.was { background: var(--line); box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.legend i.now { background: var(--daisy); }
.skill-board { gap: 0; padding: 8px 16px 14px; }
.skill-row { display: flex; flex-direction: column; gap: 8px; padding: 12px 0; }
.skill-row + .skill-row { border-top: 1px solid var(--line); }
.skill-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.skill-top b { display: block; font-size: 16px; }
.skill-top small { display: block; margin-top: 2px; color: var(--ink-3); font-size: 13px; font-weight: 500; }
.skill-change { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; padding-top: 2px; }
.skill-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.skill-bar i { height: 8px; border-radius: 4px; background: var(--surface-2); }
.skill-bar i.was { background: var(--line); box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.skill-bar i.on { background: var(--daisy); box-shadow: none; }
.skill-meaning { margin: 0; }
.diag-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.diag-tile {
  position: relative; aspect-ratio: 16 / 10; border-radius: 16px; overflow: hidden; color: #fff;
  display: flex; align-items: flex-end; padding: 10px; font-weight: 600; text-align: left;
}
.diag-tile b { position: relative; z-index: 1; font-size: 14px; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.35); }
.diag-play {
  position: absolute; top: 50%; left: 50%; width: 42px; height: 42px; margin: -21px 0 0 -21px;
  border-radius: 50%; background: rgba(255, 255, 255, 0.92); color: #1b1a25;
  display: grid; place-items: center;
}
.diag-play svg { width: 16px; height: 16px; margin-left: 2px; }
.diag-tile video { position: absolute; inset: 0; width: 100%; height: 100%; background: #14121a; }
.point-note { gap: 12px; }
.point-note h2 { font-size: 20px; line-height: 1.2; }
.point-note h4 {
  margin: 0; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); font-weight: 700;
}
.point-note p { margin: 4px 0 0; white-space: pre-wrap; }
.point-note section + section { margin-top: 4px; }
.consent-row { flex-direction: row; align-items: center; justify-content: space-between; gap: 16px; }
.consent-row .muted { margin-top: 4px; }
.switch {
  width: 48px; height: 30px; border-radius: 999px; border: 0; background: var(--surface-2); position: relative; flex: none;
}
.switch span {
  position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff;
  transition: left 0.15s ease;
}
.switch[aria-checked="true"] { background: var(--daisy); }
.switch[aria-checked="true"] span { left: 21px; }
.switch:disabled { opacity: 0.6; }
.cal {
  background: var(--surface);
  border-radius: 24px;
  padding: 16px 12px 14px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.cal-head, .cal-title { display: flex; align-items: center; gap: 4px; }
.cal-head { justify-content: space-between; padding: 0 6px; }
.cal-title h2 { font-family: var(--display); font-size: 22px; line-height: 1; }
.cal-title button { width: 28px; height: 28px; border-radius: 50%; color: var(--ink-2); font-size: 22px; line-height: 1; }
.cal-title button:disabled { opacity: 0.28; }
.cal-score { color: var(--ink-3); font-weight: 600; font-size: 14px; }
.cal-week, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }

  }
}());

function attendancePage() {
  const group = groupOf(ui.groupId) || db.groups[0];
  const kids = kidsIn(group.id);
  const days = [];
  for (let day = 1; day <= 30; day += 1) {
    const date = new Date(ui.year, ui.month - 1, day);
    const iso = `${ui.year}-${pad(ui.month)}-${pad(day)}`;
    if (iso >= "2026-11-27") continue;
    for (const lesson of group.lessons) {
      if (((date.getDay() + 6) % 7) !== lesson.weekday) continue;
      days.push({ date: iso, day: DAYS[lesson.weekday], starts_at: lesson.starts_at, title: lesson.title, date_label: dateLabel(iso) });
    }
  }
  const windows = [];
  for (const day of days) {
    const last = windows[windows.length - 1];
    if (last && last.date === day.date) last.lessons.push(day);
    else windows.push({ date: day.date, day: day.day, lessons: [day] });
  }
  const gaps = [];
  for (const day of days) {
    for (const child of kids) {
      const mark = db.marks[`${child.id}|${day.date}|${day.starts_at}`];
      if (mark?.present === false && !(mark.reason && mark.decision)) gaps.push({ child, day, mark });
    }

  document.getElementById("root").innerHTML = ui.loggedIn ? shell(view()) : loginScreen();

function writeClipboard(text) {
  if (navigator.clipboard?.writeText) return navigator.clipboard.writeText(text).then(() => true).catch(() => false);
  return Promise.resolve(false);
}

function setSelect(name, value) {
  ui.select = "";
  if (name === "att-group" || name === "vid-group" || name === "alb-group" || name === "pass-group") ui.groupId = value || ui.groupId;
  if (name === "grp-branch") ui.form.branch_id = value;
  if (name.startsWith("child-group-")) {
    const child = ui.form.children.find((item) => item.id === name.slice(12));
    if (child) child.group_id = value;
  }
  if (name === "prog-group") ui.form.group_id = value;
  if (name === "rep-group") ui.form.group_id = value;
  if (name === "alb-child") ui.form.child_id = value;
  if (name === "ev-kind") ui.form.kind = value;
  if (name === "pt-group") ui.form.group_id = value;
  if (name === "pt-code") ui.form.code = value;
  render();
}

function readFamily() {
  ui.form.phone = document.getElementById("fam-phone")?.value ?? ui.form.phone;
  ui.form.display_name = document.getElementById("fam-name")?.value ?? ui.form.display_name;
  document.querySelectorAll("[data-field][data-id]").forEach((input) => {
    const child = ui.form.children.find((item) => item.id === input.dataset.id);
    if (child) child[input.dataset.field] = input.value;
  });
}

document.getElementById("root").addEventListener("click", (event) => {
  const el = event.target.closest("[data-act]");
  if (!el || !document.getElementById("root").contains(el)) return;
  const act = el.dataset.act;
  if (act === "stop") return;
  event.preventDefault();
  if (act === "nav") {
    if (el.dataset.screen === "family") loadFamily(el.dataset.id || "new");
    if (el.dataset.screen === "group") loadGroup(el.dataset.id || "new");
    if (["program", "report", "event", "teacher", "contact", "point", "branch"].includes(el.dataset.screen)) ui.form = {};
    go(el.dataset.screen, el.dataset.id || "");
  } else if (act === "logout") {
    ui.loggedIn = false;
    ui.loginError = "";
    history.pushState({ demo: 1 }, "", "#/login");
    render();
  } else if (act === "login") {
    ui.loginUser = document.getElementById("login-user")?.value.trim() || "";
    ui.loginPass = document.getElementById("login-pass")?.value || "";
    if (!ui.loginUser || !ui.loginPass) { ui.loginError = "Введите логин и пароль."; render(); return; }
    ui.loggedIn = true;
    ui.user = ui.loginUser;
    go("families");
  } else if (act === "copy") {
    const family = db.families.find((item) => item.id === el.dataset.id);
    void writeClipboard(family.invite.link).then((ok) => {
      ui.copied = ok ? family.id : "";
      notify(ok ? "Ссылка скопирована" : family.invite.link);
      render();
    });
  } else if (act === "select-toggle") {
    ui.select = ui.select === el.dataset.name ? "" : el.dataset.name;
    render();
  } else if (act === "select") setSelect(el.dataset.name, el.dataset.value);
  else if (act === "add-child") { readFamily(); ui.form.children.push({ id: nid("c"), first_name: "", last_name: "", group_id: "", birth_date: "" }); render(); }
  else if (act === "drop-child") { readFamily(); ui.form.children = ui.form.children.filter((item) => item.id !== el.dataset.id); render(); }
  else if (act === "save-family") {
    readFamily();
    const payload = { display_name: ui.form.display_name, phone: ui.form.phone, status: "waiting", invite: { token: nid("i"), link: `http://localhost:5173/i/${nid("i")}` }, children: ui.form.children.filter((child) => child.first_name.trim()) };
    if (ui.id === "new") {
      payload.id = nid("f");
      db.families.unshift(payload);
      ui.id = payload.id;
    } else {
      const family = db.families.find((item) => item.id === ui.id);
      Object.assign(family, { display_name: payload.display_name, phone: payload.phone, children: payload.children });
    }
    ui.form.saved = true;
    notify("Сохранено");
    render();
  } else if (act === "renew") {
    const family = db.families.find((item) => item.id === ui.id);
    family.invite = { token: nid("i"), link: `http://localhost:5173/i/${nid("i")}` };
    family.status = "waiting";
    notify("Новая ссылка готова, старая закрыта");
    render();
  } else if (act === "del-family") {
    if (!window.confirm("Убрать семью из кабинета?")) return;
    db.families = db.families.filter((item) => item.id !== ui.id);
    go("families");
  } else if (act === "day") {
    const weekday = Number(el.dataset.day);
    ui.form.openDay = ui.form.openDay === weekday ? null : weekday;
    if (ui.form.openDay !== null && !ui.form.slots.some((slot) => slot.weekday === weekday)) ui.form.slots.push({ id: nid("s"), weekday, starts_at: "", title: "" });
    render();
  } else if (act === "add-slot") { ui.form.slots.push({ id: nid("s"), weekday: ui.form.openDay, starts_at: "", title: "" }); render(); }
  else if (act === "drop-slot") { ui.form.slots = ui.form.slots.filter((slot) => slot.id !== el.dataset.id); render(); }
  else if (act === "clear-day") { ui.form.slots = ui.form.slots.filter((slot) => slot.weekday !== ui.form.openDay); ui.form.openDay = null; render(); }
  else if (act === "save-group") {
    ui.form.name = document.getElementById("grp-name")?.value || ui.form.name;
    ui.form.age_label = document.getElementById("grp-age")?.value || ui.form.age_label;
    const lessons = ui.form.slots.filter((slot) => slot.starts_at && slot.title.trim()).map(({ weekday, starts_at, title }) => ({ weekday, starts_at, title }));
    if (ui.id === "new") {
      const created = { id: nid("g"), name: ui.form.name, branch_id: ui.form.branch_id, age_label: ui.form.age_label, schedule_note: "", lessons };
      db.groups.push(created);
      ui.id = created.id;
      loadGroup(created.id);
    } else {
      Object.assign(groupOf(ui.id), { name: ui.form.name, branch_id: ui.form.branch_id, age_label: ui.form.age_label, lessons });
      ui.form.saved = true;
    }
    notify("Сохранено");
    render();
  } else if (act === "del-group") {
    if (!window.confirm("Удалить группу?")) return;
    db.groups = db.groups.filter((item) => item.id !== ui.id);
    go("groups");
  } else if (act === "mark") {
    const key = `${el.dataset.child}|${el.dataset.date}|${el.dataset.at}`;
    const next = el.dataset.val === "true";
    const cell = db.marks[key] || { present: null, reason: "", note: "", decision: "", title: "" };
    cell.present = cell.present === next ? null : next;
    db.marks[key] = cell;
    render();
  } else if (act === "fill") {
    kidsIn(ui.groupId).forEach((child) => {
      const key = `${child.id}|${el.dataset.date}|${el.dataset.at}`;
      const cell = db.marks[key] || { present: null, reason: "", note: "", decision: "", title: "" };
      if (cell.present == null) cell.present = true;
      db.marks[key] = cell;
    });
    render();
  } else if (act === "decide") {
    const cell = db.marks[`${el.dataset.child}|${el.dataset.date}|${el.dataset.at}`];
    cell.decision = cell.decision === el.dataset.val ? "" : el.dataset.val;
    render();
  } else if (act === "save-program") {
    const dirs = [...document.querySelectorAll("[data-dir]")].reduce((map, input) => {
      const index = Number(input.dataset.dir);
      map[index] = map[index] || {};
      map[index][input.dataset.field] = input.value;
      return map;
    }, []);
    if (ui.id === "new") {
      const [year, month] = (document.getElementById("prog-month")?.value || "2026-12").split("-").map(Number);
      db.programs.unshift({ id: nid("p"), group_id: ui.form.group_id || "g1", year, month, filled: dirs.some((line) => line.topics || line.goal), directions: dirs });
      go("programs");
    } else {
      const program = db.programs.find((item) => item.id === ui.id);
      program.directions = dirs;
      program.filled = dirs.some((line) => line.topics || line.goal);
      notify("Сохранено");
      render();
    }
  } else if (act === "create-report") {
    const [year, month] = (document.getElementById("rep-month")?.value || "2026-11").split("-").map(Number);
    const created = { id: nid("r"), group_id: ui.form.group_id || "g1", year, month, sent: false, studied: "", focus: "", homework: "", lines: {} };
    db.reports.unshift(created);
    go("report", created.id);
  } else if (act === "save-report") {
    const report = db.reports.find((item) => item.id === ui.id);
    report.studied = document.getElementById("rep-studied").value;
    report.focus = document.getElementById("rep-focus").value;
    report.homework = document.getElementById("rep-homework").value;
    document.querySelectorAll("[data-line]").forEach((input) => { report.lines[input.dataset.line] = input.value; });
    notify("Сохранено");
    render();
  } else if (act === "send-report") {
    db.reports.find((item) => item.id === ui.id).sent = true;
    notify("Отчёт у родителей");
    render();
  } else if (act === "upload-video") {
    const date = document.getElementById("vid-date")?.value;
    const file = document.getElementById("vid-file")?.files?.[0];
    if (!file || !date) { notify("Нужны дата и файл"); return; }
    db.videos.unshift({ id: nid("v"), group_id: ui.groupId, date, name: file.name });
    ui.videoFile = "";
    ui.videoDate = "";
    notify("Загружено");
    render();
  } else if (act === "del-video") { db.videos = db.videos.filter((item) => item.id !== el.dataset.id); render(); }
  else if (act === "album-kind") { ui.albumKind = el.dataset.kind; render(); }
  else if (act === "create-album") {
    const title = document.getElementById("alb-title")?.value.trim();
    const date = document.getElementById("alb-date")?.value;
    if (!title || !date) { notify("Нужны название и дата"); return; }
    const created = { id: nid("a"), kind: ui.albumKind, group_id: ui.groupId, child_id: ui.form.child_id || "", title, date, photos: [] };
    db.albums.unshift(created);
    ui.albumOpen = created.id;
    ui.albumTitle = "";
    ui.albumDate = "";
    render();
  } else if (act === "open-album") { ui.albumOpen = ui.albumOpen === el.dataset.id ? "" : el.dataset.id; render(); }
  else if (act === "del-album") { db.albums = db.albums.filter((item) => item.id !== el.dataset.id); if (ui.albumOpen === el.dataset.id) ui.albumOpen = ""; render(); }
  else if (act === "del-photo") {
    const album = db.albums.find((item) => item.id === el.dataset.album);
    album.photos = album.photos.filter((photo) => photo.id !== el.dataset.id);
    render();
  } else if (act === "preview") { ui.preview = el.dataset.url; render(); }
  else if (act === "close-preview") { ui.preview = ""; render(); }
  else if (act === "create-event") {
    const created = { id: nid("e"), kind: ui.form.kind || "show", title: document.getElementById("ev-title")?.value || "Событие", date: document.getElementById("ev-date")?.value || "2026-12-20", starts_at: "17:00", place: "Филиал Центр", price: 0, scope: "school", group_id: "", branch_id: "b1", description: "", requests: [] };
    db.events.unshift(created);
    go("event", created.id);
  } else if (act === "save-event") {
    const eventCard = db.events.find((item) => item.id === ui.id);
    eventCard.place = document.getElementById("ev-place").value;
    eventCard.starts_at = document.getElementById("ev-time").value;
    eventCard.price = Number(document.getElementById("ev-price").value) || 0;
    eventCard.description = document.getElementById("ev-text").value;
    notify("Сохранено");
    render();
  } else if (act === "signup") {
    const eventCard = db.events.find((item) => item.id === ui.id);
    const row = eventCard.requests.find((item) => item.id === el.dataset.id);
    row.status = row.status === "registered" ? "requested" : "registered";
    render();
  } else if (act === "save-teacher") {
    const payload = { name: document.getElementById("tch-name").value, teaches: document.getElementById("tch-teaches").value, about: document.getElementById("tch-about").value, groups: [] };
    if (ui.id === "new") { payload.id = nid("t"); db.teachers.push(payload); go("teachers"); }
    else { Object.assign(db.teachers.find((item) => item.id === ui.id), payload); notify("Сохранено"); render(); }
  } else if (act === "save-contact") {
    const payload = { name: document.getElementById("ct-name").value, reach: document.getElementById("ct-reach").value, topics: document.getElementById("ct-topics").value };
    if (ui.id === "new") { payload.id = nid("k"); db.contacts.push(payload); go("teachers"); }
    else { Object.assign(db.contacts.find((item) => item.id === ui.id), payload); notify("Сохранено"); render(); }
  } else if (act === "rate-open") { ui.ratePicked = el.dataset.id; render(); }
  else if (act === "rate-close") { ui.ratePicked = ""; render(); }
  else if (act === "rate-done") {
    const row = db.ratings.find((item) => item.id === el.dataset.id);
    row.task_open = false;
    ui.ratePicked = ui.ratePicked === row.id ? row.id : ui.ratePicked;
    notify("Звонок закрыт");
    render();
  } else if (act === "show-paid") { ui.showPaid = el.dataset.val === "1"; render(); }
  else if (act === "plans") { ui.plansOpen = true; render(); }
  else if (act === "plans-close") { ui.plansOpen = false; render(); }
  else if (act === "pass-open") { ui.passDraft = el.dataset.id; render(); }
  else if (act === "pass-close") { ui.passDraft = null; render(); }
  else if (act === "pass-paid") {
    const child = db.passes[ui.groupId][ui.passDraft];
    child.paid = el.dataset.val === "null" ? null : el.dataset.val === "true";
    render();
  } else if (act === "pass-save") {
    const child = db.passes[ui.groupId][ui.passDraft];
    child.due_on = document.getElementById("pass-due").value;
    child.lessons_note = document.getElementById("pass-note").value;
    ui.passDraft = null;
    notify("Сохранено");
    render();
  } else if (act === "confirm-pass") {
    const row = db.passRequests.find((item) => item.id === el.dataset.id);
    row.status = "done";
    db.passes[row.group_id][row.child_id].paid = true;
    notify("Заявка подтверждена");
    render();
  } else if (act === "create-point") {
    const created = { id: nid("pt"), group_id: ui.form.group_id || "g1", code: ui.form.code || "C", season: "2026/2027", date: document.getElementById("pt-date")?.value || "2026-05-20", sent: false, scores: {} };
    db.points.unshift(created);
    go("point", created.id);
  } else if (act === "score") {
    const point = db.points.find((item) => item.id === ui.id);
    point.scores[el.dataset.child] = point.scores[el.dataset.child] || {};
    const current = point.scores[el.dataset.child][el.dataset.skill];
    const next = Number(el.dataset.score);
    point.scores[el.dataset.child][el.dataset.skill] = current === next ? undefined : next;
    render();
  } else if (act === "send-point") {
    db.points.find((item) => item.id === ui.id).sent = true;
    notify("Точка у родителей");
    render();
  } else if (act === "save-rubric") {
    document.querySelectorAll("[data-skill]").forEach((input) => {
      const skill = db.skills.find((item) => item.code === input.dataset.skill);
      if (skill) skill.name = input.value;
    });
    notify("Сохранено");
    render();
  } else if (act === "save-branch") {
    const payload = { name: document.getElementById("br-name").value, address: document.getElementById("br-address").value };
    if (ui.id === "new") { payload.id = nid("b"); db.branches.push(payload); go("branches"); }
    else { Object.assign(branchOf(ui.id), payload); notify("Сохранено"); render(); }
  }
});

document.getElementById("root").addEventListener("input", (event) => {
  const target = event.target;
  if (target.id === "search") { ui.query = target.value; render(); document.getElementById("search")?.focus(); const el = document.getElementById("search"); if (el) el.setSelectionRange(el.value.length, el.value.length); }
  if (target.id === "login-user") ui.loginUser = target.value;
  if (target.id === "login-pass") ui.loginPass = target.value;
  if (target.id === "vid-file") { ui.videoFile = target.files?.[0]?.name || ""; render(); }
  if (target.dataset.slot) {
    const slot = ui.form.slots.find((item) => item.id === target.dataset.slot);
    if (slot) slot[target.dataset.field] = target.value;
  }
});

window.addEventListener("popstate", () => { applyHash(); render(); });
window.addEventListener("keydown", (event) => {
  if (event.key !== "Escape") return;
  ui.select = "";
  ui.preview = "";
  ui.ratePicked = "";
  ui.passDraft = null;
  ui.plansOpen = false;
  render();
});

if (!location.hash) history.replaceState({ demo: 1 }, "", "#/families");
applyHash();
render();

  </script>
</body>
</html>
