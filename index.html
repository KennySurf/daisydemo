<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f2f7">
  <title>Daisy — демо кабинета родителя</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
  <style>
:root {
  color-scheme: light;
  --bg: #f3f2f7;
  --surface: #ffffff;
  --surface-2: #ebe9f2;
  --line: #e2e0ea;
  --ink: #1b1930;
  --ink-2: #55526a;
  --ink-3: #8b889d;
  --daisy: #f7c948;
  --daisy-soft: #fdf1c9;
  --daisy-ink: #3b2e00;
  --ok: #1d8f53;
  --bad: #c43d33;
  --shadow: 0 1px 2px rgba(27, 25, 48, 0.05), 0 6px 18px rgba(27, 25, 48, 0.06);
  --display: "Unbounded", "Onest", system-ui, sans-serif;
  --body: "Onest", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #111018;
    --surface: #1b1a25;
    --surface-2: #262433;
    --line: #2e2b3c;
    --ink: #f2f1f8;
    --ink-2: #b7b4c8;
    --ink-3: #86839a;
    --daisy: #f5c63f;
    --daisy-soft: #3a3115;
    --daisy-ink: #f8e7a2;
    --ok: #45c983;
    --bad: #f07a70;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body, #root { min-height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.45;
}
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, p { margin: 0; }
.d { font-family: var(--display); font-weight: 600; letter-spacing: -0.01em; }
.muted { color: var(--ink-3); }
.sub { color: var(--ink-2); }
.fine { font-size: 12.5px; color: var(--ink-3); }
.fine.bad { color: var(--bad); }
.label { font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
.app {
  max-width: 440px;
  margin: 0 auto;
  min-height: 100%;
  padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px));
}
@media (min-width: 600px) {
  body { background: var(--surface-2); }
  .app { background: var(--bg); border-inline: 1px solid var(--line); min-height: 100vh; }
}
.top, .subtop {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--bg);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
}
.grow { flex: 1; min-width: 0; }
.top h2, .subtop h2 { font-size: 17px; }
.logo { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 600; font-size: 17px; }
.logo svg { width: 28px; height: 28px; }
.login .logo { font-size: 22px; }
.login .logo svg { width: 44px; height: 44px; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px;
  display: grid; place-items: center; position: relative;
  flex: none; line-height: 0;
}
.icon-btn.ask { color: var(--daisy-ink); }
.icon-btn.ask svg { transform: translateY(1px); width: 24px; height: 24px; stroke-width: 1.35; }
.icon-btn.ask .ask-bubble { fill: var(--daisy); stroke: var(--daisy-ink); }
.bell-dot {
  position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%;
  background: var(--bad); box-shadow: 0 0 0 2px var(--bg);
}
.li.unread b { position: relative; }
.li.unread b::after {
  content: ""; display: inline-block; width: 7px; height: 7px; margin-left: 8px;
  border-radius: 50%; background: var(--daisy); vertical-align: middle;
}
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn:active, .kid-switch:active, .tab:active { transform: scale(0.96); }
.kid-switch {
  display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px;
  border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; font-size: 14px;
}
.view { display: flex; flex-direction: column; gap: 16px; padding: 8px 16px 20px; }
.page-title { font-size: 24px; padding-top: 8px; padding-bottom: 4px; line-height: 1.2; }
.card, .list {
  background: var(--surface);
  border-radius: 20px;
  box-shadow: var(--shadow);
}
.card { padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.hero { display: flex; gap: 16px; align-items: center; padding: 6px 0 4px; }
.hero .meta { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.hero h1 { font-size: 26px; line-height: 1.15; }
.hero .sub, .hero .muted { line-height: 1.4; }
.ph, .av {
  display: grid; place-items: center; color: #fff; font-family: var(--display); font-weight: 600;
  background: radial-gradient(circle at 30% 25%, hsl(var(--h) 85% 82%), hsl(calc(var(--h) + 25) 55% 52%));
}
.ph { width: 112px; height: 112px; border-radius: 32px; font-size: 44px; }
.portrait {
  width: 84px; height: 84px; border-radius: 24px; flex: none; object-fit: cover;
  display: grid; place-items: center; color: #fff; font-family: var(--display); font-weight: 600; font-size: 30px;
  background: radial-gradient(circle at 30% 25%, hsl(var(--h) 85% 78%), hsl(calc(var(--h) + 28) 55% 48%));
}
.person-row { flex-direction: row; align-items: center; gap: 14px; width: 100%; text-align: left; }
.person-row > div { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.person-row h3,
.person-row .muted,
.person-row p {
  overflow: hidden;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
}
.chip {
  display: inline-flex;
  align-items: center;
  font-size: 12px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 999px;
  background: var(--daisy-soft);
  color: var(--daisy-ink);
}
.chip.ok { background: color-mix(in srgb, var(--ok) 16%, var(--surface)); color: var(--ok); }
.chip.bad { background: color-mix(in srgb, var(--bad) 16%, var(--surface)); color: var(--bad); }
.name-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.av { width: 26px; height: 26px; border-radius: 50%; font-size: 12px; flex: none; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.big { font-family: var(--display); font-size: 19px; font-weight: 600; line-height: 1.2; }
.schedule { display: flex; flex-direction: column; gap: 12px; }
.schedule-head { gap: 8px; }
.schedule-head h3 { font-size: 22px; line-height: 1.15; }
.schedule-note { white-space: pre-line; }
.place-line { display: flex; align-items: flex-start; gap: 8px; }
.place-line svg { width: 18px; height: 18px; flex: none; margin-top: 2px; }
.day-mark {
  width: 52px; flex: none; background: var(--surface-2); border-radius: 14px;
  padding: 8px 0; text-align: center; font-family: var(--display); font-weight: 600; font-size: 16px;
}
.lesson-time { display: block; font-variant-numeric: tabular-nums; }
.list { overflow: hidden; }
.li { display: flex; align-items: center; gap: 12px; padding: 14px 16px; width: 100%; text-align: left; }
.li + .li { border-top: 1px solid var(--line); }
.li small { display: block; color: var(--ink-3); font-size: 13px; }
.chev { color: var(--ink-3); }
.chev svg { width: 18px; height: 18px; }
.seg { display: flex; background: var(--surface-2); border-radius: 14px; padding: 4px; gap: 4px; }
.seg span, .seg button { flex: 1; text-align: center; padding: 8px 6px; border-radius: 10px; font-weight: 600; font-size: 14px; color: var(--ink-3); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); }
.months { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding: 2px 16px 4px; }
.months::-webkit-scrollbar { display: none; }
.mo {
  flex: none; width: 58px; padding: 8px 0 7px; border-radius: 14px; background: var(--surface);
  border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 3px; font-weight: 600;
}
.mo small { font-size: 10.5px; font-weight: 500; color: var(--ink-3); }
.mo[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.mo[aria-pressed="true"] small { color: var(--bg); opacity: 0.75; }
.mo.now { border-color: var(--daisy); border-width: 2px; }
.program-title { font-size: 20px; }
.program-card { gap: 8px; }
.dir { gap: 10px; }
.dir-head { display: flex; align-items: center; gap: 10px; }
.dir-head h3 { font-size: 17px; }
.dir-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; margin-top: 5px; }
.dir-head .dir-dot { margin-top: 0; }
.dir-line { display: flex; align-items: flex-start; gap: 8px; font-size: 14px; }
.dir-line b { font-weight: 600; }
.kv { display: grid; grid-template-columns: 92px 1fr; gap: 4px 10px; font-size: 14px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; white-space: pre-wrap; }
.report-card {
  position: relative; overflow: hidden; isolation: isolate;
  background: var(--daisy); color: var(--daisy-ink); box-shadow: none;
  padding-right: 72px;
}
.report-card h3 { font-family: var(--display); font-size: 22px; line-height: 1.15; }
.report-card p { color: var(--daisy-ink); opacity: 0.82; }
.report-card .chip {
  background: #1a1710; color: #f3d78a; width: fit-content; margin-bottom: 6px;
  font-family: var(--display); font-size: 12px; font-weight: 600;
  padding: 5px 12px; letter-spacing: 0.01em;
}
.report-bloom {
  position: absolute; right: -16px; bottom: -20px; width: 96px; height: 96px;
  pointer-events: none; z-index: 0;
}
.report-card > :not(.report-bloom) { position: relative; z-index: 1; }
.report-index { display: flex; flex-direction: column; gap: 12px; }
.report-month {
  background: var(--surface); border-radius: 22px; padding: 16px 16px 14px;
  box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 4px;
}
.report-month.new { background: var(--daisy); color: var(--daisy-ink); }
.report-month.new .label, .report-month.new .muted { color: var(--daisy-ink); opacity: 0.72; }
.report-month h2 { font-family: var(--display); font-size: 26px; line-height: 1.05; }
.report { display: flex; flex-direction: column; gap: 12px; }
.report-lead { padding: 2px 2px 0; }
.report-lead h1 { font-size: 26px; line-height: 1.1; margin-top: 4px; }
.report-block {
  background: var(--surface); border-radius: 22px; padding: 16px;
  box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px;
}
.report-block h4 {
  margin: 0; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--ink-3); font-weight: 700;
}
.report-block p { margin: 0; white-space: pre-wrap; }
.report-block ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.report-block.accent { background: var(--daisy); color: var(--daisy-ink); box-shadow: none; }
.report-block.accent h4 { color: var(--daisy-ink); opacity: 0.62; }
.report-note { padding: 0 4px; }
.event-list { display: flex; flex-direction: column; gap: 12px; }
.event-card h1, .event-card h2 { font-size: 22px; line-height: 1.15; }
.event-text { white-space: pre-wrap; }
.event-status { font-weight: 600; }
.event-form { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
.choice-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.choice {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  padding: 10px 14px;
  border-radius: 14px;
  background: var(--surface-2);
  font-weight: 600;
  text-align: left;
}
.choice small { font-weight: 500; color: var(--ink-3); font-size: 12.5px; }
.choice[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.choice[aria-pressed="true"] small { color: inherit; opacity: 0.72; }
.event-past-title { font-size: 18px; padding: 4px 2px 0; }
.head-row { display: flex; align-items: center; padding: 6px 4px 0; }
.head-row a { font-weight: 600; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 13px 18px; border-radius: 14px; font-weight: 600; background: var(--ink); color: var(--bg); width: 100%;
  transition: transform 0.12s ease, filter 0.12s ease, background-color 0.2s ease, box-shadow 0.2s ease;
}
.btn:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.05); }
.btn:active:not(:disabled) { transform: translateY(1px) scale(0.98); }
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn:disabled { opacity: 0.45; }
.btn.busy:disabled { opacity: 1; cursor: progress; }
.btn.busy::before {
  content: "";
  width: 15px; height: 15px; flex: none; border-radius: 50%;
  border: 2px solid currentColor; border-right-color: transparent;
  animation: spin 0.7s linear infinite;
}
.btn.done { background: var(--ok); color: #fff; }
@keyframes spin { to { transform: rotate(360deg); } }
.field { display: flex; flex-direction: column; gap: 6px; }
.field span { font-size: 13px; color: var(--ink-3); font-weight: 500; }
.input { background: var(--surface-2); border: 1px solid transparent; border-radius: 12px; padding: 12px 14px; width: 100%; }
.input:focus { outline: none; border-color: var(--ink); }
.code { display: grid; grid-template-columns: repeat(4, 56px); gap: 10px; }
.code input { text-align: center; font-size: 24px; font-weight: 600; padding: 12px 0; }
.steps { display: flex; gap: 6px; }
.steps i { height: 4px; flex: 1; border-radius: 2px; background: var(--line); }
.steps i.on { background: var(--ink); }
.login {
  position: fixed; inset: 0; z-index: 70; background: var(--bg); display: flex; justify-content: center; overflow: auto;
}
.login .in {
  width: min(100%, 440px); display: flex; flex-direction: column; gap: 18px; justify-content: center; min-height: 100%;
  padding: 32px 24px;
}
.login h1 { font-size: 24px; line-height: 1.2; }
.linkish { font-size: 14px; font-weight: 600; }
.tabs {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: min(100%, 440px); z-index: 25;
  background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(6, 1fr);
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
}
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 500; color: var(--ink-3); padding: 4px 0; position: relative; }
.tab svg { width: 23px; height: 23px; }
.tab.active { color: var(--ink); font-weight: 600; }
.tab.active::before { content: ""; position: absolute; top: -6px; width: 22px; height: 3px; border-radius: 0 0 3px 3px; background: var(--daisy); }
.overlay { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.overlay.center { align-items: center; padding: 20px; }
.scrim { position: absolute; inset: 0; background: rgba(20, 18, 36, 0.45); }
.sheet {
  position: relative; width: min(100%, 440px); background: var(--bg); border-radius: 24px 24px 0 0;
  padding: 10px 16px calc(20px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); align-self: center; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.people { display: flex; flex-direction: column; gap: 12px; }
.person-sheet {
  position: relative;
  width: min(100%, 360px);
  background: var(--surface);
  border-radius: 28px;
  box-shadow: var(--shadow);
  padding: 24px 20px 22px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 10px;
  max-height: min(82vh, 640px);
  overflow: auto;
}
.person-sheet-face { width: 112px; height: 112px; border-radius: 32px; font-size: 44px; }
.person-sheet-text { white-space: pre-wrap; text-align: left; width: 100%; }
.person-sheet-reach { font-weight: 700; color: var(--ink); }
.video-feed { display: flex; flex-direction: column; gap: 12px; }
.video-feed video { width: 100%; border-radius: 16px; background: #14121a; }
.progress-feed { display: flex; flex-direction: column; gap: 14px; }
.points { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pt {
  background: var(--surface); border-radius: 16px; padding: 10px 12px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 2px; min-width: 0;
}
.pt b { font-family: var(--display); font-size: 20px; line-height: 1.1; }
.pt small { font-size: 12px; color: var(--ink-3); line-height: 1.3; }
.pt.wait { background: transparent; box-shadow: none; border: 1.5px dashed var(--line); }
.pt.wait b { color: var(--ink-3); }
.compare-card { gap: 10px; }
.compare-card h3 { font-size: 17px; }
.compare-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.grew {
  flex: none; background: color-mix(in srgb, var(--ok) 16%, var(--surface)); color: var(--ok);
  font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
}
.legend { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 18px; height: 8px; border-radius: 4px; display: inline-block; }
.legend i.was { background: var(--line); box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.legend i.now { background: var(--daisy); }
.skill-board { gap: 0; padding: 8px 16px 14px; }
.skill-row { display: flex; flex-direction: column; gap: 8px; padding: 12px 0; }
.skill-row + .skill-row { border-top: 1px solid var(--line); }
.skill-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.skill-top b { display: block; font-size: 16px; }
.skill-top small { display: block; margin-top: 2px; color: var(--ink-3); font-size: 13px; font-weight: 500; }
.skill-change { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; padding-top: 2px; }
.skill-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.skill-bar i { height: 8px; border-radius: 4px; background: var(--surface-2); }
.skill-bar i.was { background: var(--line); box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.skill-bar i.on { background: var(--daisy); box-shadow: none; }
.skill-meaning { margin: 0; }
.diag-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.diag-tile {
  position: relative; aspect-ratio: 16 / 10; border-radius: 16px; overflow: hidden; color: #fff;
  display: flex; align-items: flex-end; padding: 10px; font-weight: 600; text-align: left;
}
.diag-tile b { position: relative; z-index: 1; font-size: 14px; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.35); }
.diag-play {
  position: absolute; top: 50%; left: 50%; width: 42px; height: 42px; margin: -21px 0 0 -21px;
  border-radius: 50%; background: rgba(255, 255, 255, 0.92); color: #1b1a25;
  display: grid; place-items: center;
}
.diag-play svg { width: 16px; height: 16px; margin-left: 2px; }
.diag-tile video { position: absolute; inset: 0; width: 100%; height: 100%; background: #14121a; }
.point-note { gap: 12px; }
.point-note h2 { font-size: 20px; line-height: 1.2; }
.point-note h4 {
  margin: 0; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); font-weight: 700;
}
.point-note p { margin: 4px 0 0; white-space: pre-wrap; }
.point-note section + section { margin-top: 4px; }
.consent-row { flex-direction: row; align-items: center; justify-content: space-between; gap: 16px; }
.consent-row .muted { margin-top: 4px; }
.switch {
  width: 48px; height: 30px; border-radius: 999px; border: 0; background: var(--surface-2); position: relative; flex: none;
}
.switch span {
  position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff;
  transition: left 0.15s ease;
}
.switch[aria-checked="true"] { background: var(--daisy); }
.switch[aria-checked="true"] span { left: 21px; }
.switch:disabled { opacity: 0.6; }
.cal {
  background: var(--surface);
  border-radius: 24px;
  padding: 16px 12px 14px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.cal-head, .cal-title { display: flex; align-items: center; gap: 4px; }
.cal-head { justify-content: space-between; padding: 0 6px; }
.cal-title h2 { font-family: var(--display); font-size: 22px; line-height: 1; }
.cal-title button { width: 28px; height: 28px; border-radius: 50%; color: var(--ink-2); font-size: 22px; line-height: 1; }
.cal-title button:disabled { opacity: 0.28; }
.cal-score { color: var(--ink-3); font-weight: 600; font-size: 14px; }
.cal-week, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }

function child() { return kids[ui.childId]; }
function summary(person) {
  const days = person.days.filter((day) => day.date.startsWith("2026-11") && (day.state === "present" || day.state === "absent"));
  return {
    present: days.filter((day) => day.state === "present").length,
    marked: days.length,
    absences: days.filter((day) => day.state === "absent").length,
    needs_reason: days.some((day) => day.state === "absent" && !day.reason),
  };
}
function unread(person) { return person.notices.some((note) => note.unread); }
function currentHash() {
  if (!ui.loggedIn) return "#/login";
  const id = ui.childId;
  if (ui.screen === "sub") return `#/${id}/more/${ui.section}`;
  if (ui.screen === "album") return `#/${id}/album/${ui.albumId}`;
  if (ui.screen === "event") return `#/${id}/event/${ui.eventId}`;
  if (ui.screen === "learn") return `#/${id}/learn/${ui.learnTab}`;
  return `#/${id}/${ui.screen}`;
}
function applyHash() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  if (parts[0] === "login") {
    ui.loggedIn = false;
    ui.screen = "login";
    return;
  }
  ui.loggedIn = true;
  ui.childId = parts[0] === "mark" ? "mark" : "sofia";
  const rest = parts[0] === "mark" || parts[0] === "sofia" ? parts.slice(1) : parts;
  const [a, b] = rest;
  ui.sheet = null;
  ui.screen = a || "home";
  ui.section = "";
  ui.albumId = null;
  ui.eventId = null;
  if (a === "more" && b) { ui.screen = "sub"; ui.section = b; }
  if (a === "album" && b) { ui.screen = "album"; ui.albumId = b; }
  if (a === "event" && b) { ui.screen = "event"; ui.eventId = b; }
  if (a === "learn") ui.learnTab = ["program", "reports", "videos"].includes(b) ? b : "program";
  if (!["home", "learn", "report", "progress", "gallery", "album", "events", "event", "more", "sub", "notifications"].includes(ui.screen)) ui.screen = "home";
}
function navigate(patch) {
  Object.assign(ui, patch);
  ui.sheet = null;
  const next = currentHash();
  if (location.hash !== next) history.pushState({ demo: 1 }, "", next);
  render();
}
function nested() {
  return ui.screen === "sub" || ui.screen === "notifications" || ui.screen === "report" || ui.screen === "event";
}
function tabId() {
  if (ui.screen === "report" || ui.screen === "learn") return "learn";
  if (ui.screen === "album" || ui.screen === "gallery") return "gallery";
  if (ui.screen === "event" || ui.screen === "events") return "events";
  if (ui.screen === "sub" || ui.screen === "more" || ui.screen === "notifications") return ui.screen === "notifications" ? "" : "more";

}

  }).join("")}</section>`;
  const clips = points.flatMap((item) => item.videos.map((video) => ({ ...video, code: item.code })));

  return `<h1 class="d page-title">Прогресс</h1><div class="progress-feed"><div class="points">${rail}</div>${head}${board}${videos}${notes}</div>`;

function skillRows(points) {
  const earlier = points[0];
  const later = points[points.length - 1];
  const before = new Map(earlier.scores.map((score) => [score.code, score]));
  const after = new Map((points.length > 1 ? later : earlier).scores.map((score) => [score.code, score]));
  const codes = [];
  for (const score of (points.length > 1 ? later.scores.concat(earlier.scores) : earlier.scores)) {
    if (!codes.includes(score.code)) codes.push(score.code);
  }
  return codes.map((code) => ({ code, left: points.length > 1 ? before.get(code) : undefined, right: after.get(code) || before.get(code) }));
}

function attendanceScreen() {
  const person = child();
  const months = [{ year: 2026, month: 10 }, { year: 2026, month: 11 }, { year: 2026, month: 12 }];
  if (!ui.cal) ui.cal = { year: 2026, month: 11 };
  const index = months.findIndex((item) => item.year === ui.cal.year && item.month === ui.cal.month);
  const prev = index > 0 ? months[index - 1] : null;
  const next = index < months.length - 1 ? months[index + 1] : null;
  const prefix = `${ui.cal.year}-${pad(ui.cal.month)}`;
  const days = person.days.filter((day) => day.date.startsWith(prefix));
  const grouped = new Map();
  for (const day of days) {
    const list = grouped.get(day.date) || [];
    list.push(day);
    grouped.set(day.date, list);
  }
  const needing = days.find((day) => day.state === "absent" && !day.reason);
  const selected = ui.picked && grouped.has(ui.picked) ? ui.picked : (needing?.date || [...days].reverse().find((day) => day.state !== "ahead")?.date || days[0]?.date || null);
  const marked = days.filter((day) => day.state === "present" || day.state === "absent");
  const present = marked.filter((day) => day.state === "present").length;
  const cells = cellsOf(ui.cal.year, ui.cal.month).map((day, cell) => {
    if (!day) return `<span></span>`;
    const iso = `${prefix}-${pad(day)}`;
    const list = grouped.get(iso);
    if (!list) return `<span class="num">${day}</span>`;
    const paint = tone(list);
    return `<button type="button" class="${paint}${iso === selected ? " picked" : ""}" aria-pressed="${iso === selected}" data-act="pick-day" data-date="${iso}">${day}</button>`;
  }).join("");
  const chosen = selected ? grouped.get(selected) || [] : [];
  const detail = chosen.length ? `<div class="cal-detail"><b>${esc(chosen[0].date_label)}, ${weekdayName(chosen[0].date)}</b>${chosen.map((lesson) => lessonCard(lesson)).join("")}</div>` : "";
  return `<section class="cal"><div class="cal-head"><div class="cal-title"><button type="button" aria-label="Предыдущий месяц" data-act="month" data-year="${prev ? prev.year : ""}" data-month="${prev ? prev.month : ""}" ${prev ? "" : "disabled"}>‹</button><h2>${MONTHS[ui.cal.month - 1]}</h2><button type="button" aria-label="Следующий месяц" data-act="month" data-year="${next ? next.year : ""}" data-month="${next ? next.month : ""}" ${next ? "" : "disabled"}>›</button></div>${marked.length ? `<span class="cal-score">${present} из ${marked.length}</span>` : ""}</div><div class="cal-week">${["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"].map((name) => `<span>${name}</span>`).join("")}</div><div class="cal-grid">${cells}</div>${detail}</section>`;
}
function tone(lessons) {
  const due = lessons.filter((item) => item.state !== "ahead");
  const marked = due.filter((item) => item.state === "present" || item.state === "absent");
  if (!marked.length) return "wait";
  if (marked.length < due.length) return "mixed";
  const present = marked.filter((item) => item.state === "present").length;
  if (present && present < marked.length) return "mixed";
  return present ? "here" : "miss";
}
function lessonCard(lesson) {
  const key = `${lesson.date}-${lesson.starts_at}`;
  const paint = lesson.state === "present" ? "here" : lesson.state === "absent" ? "miss" : "wait";
  const needs = lesson.state === "absent" && !lesson.reason;
  let status = "Ещё впереди.";
  if (lesson.state === "present") status = "На занятии.";
  if (lesson.state === "absent" && !lesson.reason) status = "Пропуск.";
  if (lesson.state === "absent" && lesson.reason) {
    status = [lesson.reason_label, lesson.note].filter(Boolean).join(". ");
    status += lesson.note ? "." : "";
    if (!status.endsWith(".")) status += ".";
    status += " Отработку или продление выбирает школа.";
  }
  const form = needs && ui.reasonKey === key ? `<form class="reason-form" data-act="stop"><div class="seg" role="group">${[["illness", "Болезнь"], ["family", "Семейные обстоятельства"], ["other", "Другое"]].map(([code, label]) => `<button type="button" aria-pressed="${ui.draft.reason === code}" data-act="reason" data-reason="${code}">${label}</button>`).join("")}</div><label class="field"><span>Пояснение, если нужно</span><textarea class="input" id="reason-note" rows="3" maxlength="400">${esc(ui.draft.reasonNote)}</textarea></label><label class="field"><span>Файл, если нужно</span><input class="input" id="reason-file" type="file" accept="image/*,.pdf"></label><button class="btn" type="button" data-act="reason-save" data-key="${key}" ${ui.draft.reason ? "" : "disabled"}>Сохранить причину</button></form>` : "";
  const button = needs && ui.reasonKey !== key ? `<button type="button" data-act="reason-open" data-key="${key}">Указать причину</button>` : "";
  return `<article class="lesson-block ${paint}">${lesson.starts_at ? `<b>${esc(lesson.starts_at)}, ${esc(lesson.title)}</b>` : ""}<p class="${lesson.state === "present" || lesson.state === "absent" ? "" : "muted"}">${esc(status)}</p>${lesson.fileName ? `<span class="fine">Файл: ${esc(lesson.fileName)}</span>` : ""}${button}${form}</article>`;
}

    return `<div class="login"><div class="in"><div class="steps"><i class="on"></i><i class="on"></i><i></i></div><h1 class="d">Код из журнала</h1><p class="sub">Для номера ${esc(phone)}. СМС ещё не подключены: код написан в лог сервера.</p><div class="code">${ui.draft.code.map((digit, index) => `<input class="input code-cell" id="c${index}" inputmode="numeric" maxlength="1" value="${esc(digit)}" aria-label="Цифра ${index + 1}" data-index="${index}">`).join("")}</div><button class="btn" type="button" data-act="verify" ${codeReady ? "" : "disabled"}>Войти</button><p class="fine">В этой демке подойдёт любая четвёрка.</p><button class="sub linkish" type="button" data-act="login-back">Другой телефон</button></div></div>`;
  }
  return `<div class="login"><div class="in"><h1 class="d">Добавьте Daisy на экран</h1><p class="sub">Кабинет откроется как приложение. Уведомления о новых отчётах можно включить в разделе уведомлений.</p><div class="card"><b>iPhone</b><span class="sub">Поделиться → На экран «Домой»</span><b>Android</b><span class="sub">Меню браузера → Установить приложение</span></div><button class="btn" type="button" data-act="enter-now">Готово</button></div></div>`;
}
function formatPhone(digits) {
  const d = digits.slice(0, 10);
  let text = "+7";
  if (d.length) text += ` ${d.slice(0, 3)}`;
  if (d.length > 3) text += ` ${d.slice(3, 6)}`;
  if (d.length > 6) text += `-${d.slice(6, 8)}`;
  if (d.length > 8) text += `-${d.slice(8, 10)}`;
  return { text, digits: d };
}

function sheets() {
  if (ui.sheet === "kids") {
    return `<div class="overlay"><button class="scrim" type="button" data-act="close" aria-label="Закрыть"></button><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><h2>Чей кабинет открыть?</h2><div class="list">${Object.values(kids).map((item) => `<button class="li" type="button" data-act="child" data-id="${item.id}"><span class="av" style="--h:${hue(item.first_name)};width:44px;height:44px;font-size:18px">${esc(item.first_name.slice(0, 1))}</span><span class="grow"><b>${esc(item.first_name)}</b><small>${esc(item.group)}, филиал ${esc(item.branch)}</small></span></button>`).join("")}</div></div></div>`;
  }
  if (ui.sheet === "support") {
    return `<div class="overlay center"><button class="scrim" type="button" data-act="close" aria-label="Закрыть"></button><div class="person-sheet" role="dialog" aria-modal="true"><h2 class="d" id="person-sheet-title">Чат поддержки</h2><p class="muted person-sheet-text">В кабинете эта кнопка открывает ссылку школы. Адрес задаётся в настройках сервера, в демо чат не подключён.</p><button class="btn" type="button" data-act="close">Понятно</button></div></div>`;
  }
  if (ui.sheet === "person" && ui.personId) {
    const row = [...TEACHERS, ...CONTACTS].find((item) => item.id === ui.personId);
    if (!row) return "";
    const reach = row.reach && row.reach.startsWith("+") ? `<a class="person-sheet-reach" href="tel:${row.reach.replace(/[^\d+]/g, "")}">${esc(row.reach)}</a>` : row.reach ? `<p>${esc(row.reach)}</p>` : "";
    return `<div class="overlay center"><button class="scrim" type="button" data-act="close" aria-label="Закрыть"></button><div class="person-sheet" role="dialog" aria-modal="true"><span class="portrait person-sheet-face" style="--h:${hue(row.name)}">${esc(row.name.slice(0, 1))}</span>${row.teaches ? `<span class="chip">${esc(row.teaches)}</span>` : ""}<h2 class="d">${esc(row.name)}</h2>${reach}${row.about || row.topics ? `<p class="muted person-sheet-text">${esc(row.about || row.topics)}</p>` : ""}</div></div>`;
  }
  return "";
}

function view() {
  if (ui.screen === "home") return homeScreen();
  if (ui.screen === "learn") return learnScreen();
  if (ui.screen === "report") return reportScreen();
  if (ui.screen === "progress") return progressScreen();
  if (ui.screen === "gallery") return galleryScreen();
  if (ui.screen === "album") return albumScreen();
  if (ui.screen === "events") return eventsScreen();
  if (ui.screen === "event") return eventScreen();
  if (ui.screen === "more") return moreScreen();
  if (ui.screen === "sub") return subScreen();
  if (ui.screen === "notifications") return notificationsScreen();
  return homeScreen();
}

function render() {
  const root = document.getElementById("root");
  if (!ui.loggedIn) {
    root.innerHTML = loginScreen();
    return;
  }
  const inside = nested() ? `${header()}${view()}` : view();
  const top = nested() ? "" : header();
  root.innerHTML = `<div class="app">${top}<main class="view">${inside}</main></div>${tabs()}${sheets()}${lightbox()}`;
}

function openNotice(id) {
  const note = child().notices.find((item) => item.id === id);
  if (!note) return;
  note.unread = false;
  const patch = { screen: note.screen };
  if (note.section) patch.section = note.section;
  if (note.screen === "report") child().reportOpened = true;
  navigate(patch);
}

document.getElementById("root").addEventListener("click", (event) => {
  const el = event.target.closest("[data-act]");
  if (!el || !document.getElementById("root").contains(el)) return;
  const act = el.dataset.act;
  if (act === "stop") return;
  if (el.hasAttribute("download")) return;
  event.preventDefault();
  if (act === "nav") {
    const patch = { screen: el.dataset.screen, section: el.dataset.section || "", eventId: el.dataset.event || null, albumId: null, shot: null };
    if (el.dataset.tab) { patch.learnTab = el.dataset.tab; patch.screen = "learn"; }
    navigate(patch);
  } else if (act === "back") history.back();
  else if (act === "sheet") { ui.sheet = el.dataset.sheet; render(); }
  else if (act === "close" || act === "close-shot") { ui.sheet = null; if (act === "close-shot") ui.shot = null; render(); }
  else if (act === "child") navigate({ childId: el.dataset.id, screen: ui.screen === "album" || ui.screen === "event" ? "home" : ui.screen, picked: null, albumId: null, shot: null });
  else if (act === "learn") navigate({ screen: "learn", learnTab: el.dataset.tab });
  else if (act === "program") { ui.programId = el.dataset.id; render(); }
  else if (act === "video") { ui.videoOpen = el.dataset.id; render(); }
  else if (act === "diag") { ui.diag = el.dataset.id; render(); }
  else if (act === "album") navigate({ screen: "album", albumId: el.dataset.id, shot: null });
  else if (act === "shot") { ui.shot = Number(el.dataset.index); render(); }
  else if (act === "shot-step") {
    const album = child().albums.find((item) => item.id === ui.albumId);
    ui.shot = (ui.shot + Number(el.dataset.dir) + album.photos.length) % album.photos.length;
    render();
  } else if (act === "heart") {
    const album = child().albums.find((item) => item.id === ui.albumId);
    const photo = album.photos[ui.shot];
    photo.heart = !photo.heart;
    render();
  } else if (act === "event-send") {
    const eventCard = child().events.find((item) => item.id === ui.eventId);
    eventCard.signup = "requested";
    ui.draft.eventNote = "";
    render();
  } else if (act === "event-cancel") {
    const eventCard = child().events.find((item) => item.id === ui.eventId);
    eventCard.signup = "none";
    render();
  } else if (act === "logout") {
    ui.loggedIn = false;
    ui.loginStep = 0;
    ui.screen = "login";
    history.pushState({ demo: 1 }, "", "#/login");
    render();
  } else if (act === "notice") openNotice(el.dataset.id);
  else if (act === "month" && el.dataset.year) { ui.cal = { year: Number(el.dataset.year), month: Number(el.dataset.month) }; ui.picked = null; render(); }
  else if (act === "pick-day") { ui.picked = el.dataset.date; ui.reasonKey = ""; render(); }
  else if (act === "reason-open") { ui.reasonKey = el.dataset.key; ui.draft.reason = ""; ui.draft.reasonNote = ""; render(); }
  else if (act === "reason") { ui.draft.reason = el.dataset.reason; render(); }
  else if (act === "reason-save") {
    const lesson = child().days.find((day) => `${day.date}-${day.starts_at}` === el.dataset.key);
    const labels = { illness: "Болезнь", family: "Семейные обстоятельства", other: "Другое" };
    lesson.reason = ui.draft.reason;
    lesson.reason_label = labels[ui.draft.reason];
    lesson.note = ui.draft.reasonNote.trim();
    lesson.fileName = document.getElementById("reason-file")?.files?.[0]?.name || "";
    ui.reasonKey = "";
    const note = child().notices.find((item) => item.id === "n2");
    if (note) note.unread = false;
    render();
  } else if (act === "plan") {
    ui.planId = el.dataset.id;
    const plan = PLANS.find((item) => item.id === ui.planId);
    if (!plan.terms.some((item) => item.months === ui.planMonths)) ui.planMonths = plan.terms[0].months;
    render();
  } else if (act === "term") { ui.planMonths = Number(el.dataset.months); render(); }
  else if (act === "pass-send") {
    const plan = PLANS.find((item) => item.id === ui.planId);
    const term = plan.terms.find((item) => item.months === ui.planMonths);
    child().sub.request = { status: "requested", plan_name: plan.name, months: term.months, amount: term.price };
    render();
  } else if (act === "pass-cancel") { child().sub.request = null; render(); }
  else if (act === "person") { ui.sheet = "person"; ui.personId = el.dataset.id; render(); }
  else if (act === "score") { ui.rateScore = Number(el.dataset.score); render(); }
  else if (act === "rate-send" && ui.rateScore != null) { ui.rating = { score: ui.rateScore, comment: ui.draft.rateComment.trim() }; render(); }
  else if (act === "consent") { child().photo_video = !child().photo_video; render(); }
  else if (act === "push") { ui.pushOn = !ui.pushOn; render(); }
  else if (act === "send-code" && ui.draft.phone.length === 10) { ui.loginStep = 1; render(); document.getElementById("c0")?.focus(); }
  else if (act === "verify" && ui.draft.code.join("").length === 4) { ui.loginStep = 2; render(); }
  else if (act === "login-back") { ui.loginStep = 0; ui.draft.code = ["", "", "", ""]; render(); }
  else if (act === "enter-now") navigate({ loggedIn: true, screen: "home", childId: ui.childId || "sofia" });
});

document.getElementById("root").addEventListener("input", (event) => {
  const target = event.target;
  if (target.id === "phone") {
    const formatted = formatPhone(target.value.replace(/\D/g, "").replace(/^7/, "").replace(/^8/, ""));
    ui.draft.phone = formatted.digits;
    target.value = formatted.text;
    const button = document.getElementById("send-code");
    if (button) button.disabled = formatted.digits.length !== 10;
  }
  if (target.id === "event-note") ui.draft.eventNote = target.value;
  if (target.id === "rate-note") ui.draft.rateComment = target.value;
  if (target.id === "reason-note") ui.draft.reasonNote = target.value;
  if (target.classList.contains("code-cell")) {
    const index = Number(target.dataset.index);
    const digit = target.value.replace(/\D/g, "").slice(-1);
    ui.draft.code[index] = digit;
    target.value = digit;
    if (digit && index < 3) document.getElementById(`c${index + 1}`)?.focus();
    const button = document.querySelector("[data-act=verify]");
    if (button) button.disabled = ui.draft.code.join("").length < 4;
  }
});

window.addEventListener("popstate", () => { applyHash(); render(); });
window.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && (ui.sheet || ui.shot !== null)) {
    ui.sheet = null;
    ui.shot = null;
    render();
  }
});

if (!location.hash) history.replaceState({ demo: 1 }, "", "#/sofia/home");
else history.replaceState({ demo: 1 }, "", location.hash);
applyHash();
render();

  </script>
</body>
</html>
